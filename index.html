<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3E5B52">
<title>My Recipe Book</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Recipe Book">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" href="./icon-192.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Noto+Serif+SC:wght@400;500;600&display=swap');

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  --porcelain: #EEF1E9;
  --surface: #FAFBF6;
  --surface-2: #F3F5EC;
  --celadon: #6E948A;
  --celadon-deep: #3E5B52;
  --ink: #2B2B27;
  --ink-soft: #6C6F64;
  --amber: #C68A2C;
  --amber-deep: #A9741F;
  --line: #DCDFD2;
  --danger: #B15A4E;
  --font-en: 'Fraunces', Georgia, 'Times New Roman', serif;
  --font-zh: 'Noto Serif SC', 'Songti SC', 'STSong', serif;
  --font-body: system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  font-family: var(--font-body);
  color: var(--ink);
  background: var(--porcelain);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
.rb { min-height: 100vh; padding: max(22px, env(safe-area-inset-top)) clamp(14px, 3vw, 34px) calc(60px + env(safe-area-inset-bottom)); max-width: 1080px; margin: 0 auto; }

.rb-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
.rb-brand { display: flex; align-items: center; gap: 14px; }
.rb-seal { font-family: var(--font-zh); font-weight: 600; font-size: 24px; color: var(--celadon-deep); width: 46px; height: 46px; display: grid; place-items: center; flex: none; border: 1.5px solid var(--celadon); border-radius: 12px; background: var(--surface-2); box-shadow: inset 0 0 0 2px var(--porcelain); }
.rb-seal.big { width: 68px; height: 68px; font-size: 34px; margin-bottom: 6px; }
.rb-title { font-family: var(--font-en); font-weight: 600; font-size: clamp(24px, 4.5vw, 32px); margin: 0; letter-spacing: 1px; line-height: 1; }
.rb-sub { margin: 4px 0 0; font-size: 12.5px; color: var(--ink-soft); letter-spacing: .2px; }
.rb-count { font-family: var(--font-en); font-weight: 600; color: var(--celadon-deep); }

.btn { font-family: var(--font-body); font-size: 14px; font-weight: 500; border-radius: 999px; padding: 10px 18px; border: 1px solid transparent; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; transition: transform .12s ease, background .15s ease, box-shadow .15s ease; }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--amber); color: #fff; box-shadow: 0 1px 0 var(--amber-deep); }
.btn-primary:hover { background: var(--amber-deep); }
.btn-ghost { background: transparent; border-color: var(--line); color: var(--ink); }
.btn-ghost:hover { background: var(--surface-2); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { filter: brightness(.94); }
.iconbtn { background: transparent; border: 1px solid var(--line); border-radius: 9px; width: 34px; height: 34px; display: grid; place-items: center; color: var(--ink-soft); cursor: pointer; transition: background .15s, color .15s, border-color .15s; }
.iconbtn:hover { background: var(--surface-2); color: var(--ink); }
.iconbtn.danger:hover { color: var(--danger); border-color: var(--danger); }

.rb-bar { padding: 18px 0 4px; display: flex; flex-direction: column; gap: 14px; }
.rb-searchwrap { position: relative; max-width: 460px; }
.rb-searchicon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--ink-soft); pointer-events: none; display: flex; }
.rb-search { width: 100%; font-family: var(--font-body); font-size: 16px; padding: 11px 38px 11px 38px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); color: var(--ink); }
.rb-search:focus { outline: none; border-color: var(--celadon); box-shadow: 0 0 0 3px rgba(110,148,138,.16); }
.rb-clear { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: transparent; border: none; color: var(--ink-soft); cursor: pointer; padding: 4px; border-radius: 6px; display: flex; }
.rb-clear:hover { color: var(--ink); }

.rb-chiprow { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font-family: var(--font-body); font-size: 13.5px; font-weight: 500; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; cursor: pointer; display: inline-flex; align-items: baseline; gap: 6px; color: var(--ink); transition: all .15s; }
.chip:hover { border-color: var(--celadon); }
.chip-on { background: var(--celadon-deep); border-color: var(--celadon-deep); color: #fff; }

.rb-famrow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.rb-famlabel { font-family: var(--font-body); font-size: 13.5px; color: var(--ink-soft); white-space: nowrap; }
.rb-famchips { display: flex; flex-wrap: wrap; gap: 7px; }
.famchip { font-family: var(--font-body); font-size: 13px; background: var(--surface); border: 1.4px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: all .14s; }
.famchip .dot { width: 8px; height: 8px; border-radius: 50%; }
.famchip.fodmap { color: var(--celadon-deep); border-color: var(--celadon); }
.famchip.fodmap.on { background: var(--celadon-deep); border-color: var(--celadon-deep); color: #fff; }
.famchip svg { display: block; }

.rb-error { margin-top: 14px; background: #F7EBE8; border: 1px solid #E4C4BC; color: #8A473C; padding: 9px 14px; border-radius: 10px; font-size: 13px; }

.rb-grid { margin-top: 22px; display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
.card { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px 16px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 8px; min-height: 138px; transition: transform .14s ease, box-shadow .18s ease, border-color .15s; font-family: var(--font-body); width: 100%; }
.card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px -14px rgba(43,43,39,.32); border-color: var(--celadon); }
.card-top { display: flex; align-items: center; justify-content: space-between; }
.card-cat { font-size: 11px; letter-spacing: .3px; color: var(--celadon-deep); font-weight: 500; }
.card-leaf { color: var(--celadon); display: inline-flex; }
.card-zh { font-family: var(--font-zh); font-weight: 600; font-size: 21px; line-height: 1.25; margin: 2px 0 0; color: var(--ink); letter-spacing: 1px; }
.card-en { font-family: var(--font-en); font-style: italic; font-size: 13.5px; color: var(--ink-soft); margin: 0; }
.card-fam { display: flex; gap: 5px; margin-top: auto; padding-top: 6px; }
.card-dot { width: 10px; height: 10px; border-radius: 50%; }

.rb-empty { text-align: center; padding: 64px 20px; color: var(--ink-soft); display: flex; flex-direction: column; align-items: center; gap: 6px; }
.rb-empty-title { font-family: var(--font-en); font-size: 20px; color: var(--ink); margin: 4px 0 0; }
.rb-empty-sub { font-size: 13.5px; margin: 0 0 8px; }
.rb-loading { text-align: center; padding: 70px 0; color: var(--ink-soft); font-size: 14px; }

.ov { position: fixed; inset: 0; background: rgba(38,42,36,.44); backdrop-filter: blur(2px); display: flex; align-items: flex-start; justify-content: center; padding: clamp(10px, 4vh, 44px) 14px; z-index: 50; overflow-y: auto; animation: ovin .18s ease; }
@keyframes ovin { from { opacity: 0; } to { opacity: 1; } }
.sheet { background: var(--porcelain); width: 100%; max-width: 720px; border-radius: 20px; box-shadow: 0 30px 80px -30px rgba(0,0,0,.5); animation: sheetin .2s cubic-bezier(.2,.8,.3,1); overflow: hidden; font-family: var(--font-body); margin-bottom: 30px; }
.sheet-sm { max-width: 400px; }
@keyframes sheetin { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; transform: none; } }

.detail-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); background: var(--surface-2); position: sticky; top: 0; z-index: 2; }
.detail-actions { display: flex; gap: 6px; }
.detail-body { padding: 22px clamp(18px, 4vw, 30px) 30px; }
.detail-meta { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 12px; }
.metatag { font-size: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; color: var(--celadon-deep); font-weight: 500; display: inline-flex; align-items: center; gap: 5px; }
.metatag.leaf { color: var(--celadon-deep); border-color: var(--celadon); }
.metatag.ghost { color: var(--ink-soft); font-weight: 400; }
.detail-zh { font-family: var(--font-zh); font-weight: 600; font-size: clamp(28px, 6vw, 38px); line-height: 1.15; margin: 0; letter-spacing: 1.5px; }
.detail-en { font-family: var(--font-en); font-style: italic; font-size: 17px; color: var(--ink-soft); margin: 4px 0 0; }
.detail-fam { display: flex; flex-wrap: wrap; gap: 7px; margin: 16px 0 4px; }
.fampill { font-size: 12.5px; border: 1.4px solid; border-radius: 999px; padding: 4px 11px; display: inline-flex; align-items: center; gap: 6px; background: var(--surface); }
.fampill .dot { width: 8px; height: 8px; border-radius: 50%; }
.sec { margin-top: 24px; }
.sec-title { font-family: var(--font-en); font-size: 17px; font-weight: 600; margin: 0 0 10px; color: var(--celadon-deep); letter-spacing: .5px; border-bottom: 1px solid var(--line); padding-bottom: 7px; }
.sec-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.sec-text { font-family: var(--font-body); font-size: 14.5px; line-height: 1.75; color: var(--ink); white-space: pre-wrap; margin: 0; }
.sec-text.zh { font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', var(--font-body); }
.ing-list, .steps-list { list-style: none; padding: 0; margin: 0; font-family: var(--font-body); font-size: 14.5px; line-height: 1.65; color: var(--ink); }
.ing-list.zh, .steps-list.zh { font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', var(--font-body); }
.ing-list li { padding: 5px 0 5px 20px; position: relative; border-bottom: 1px dashed var(--line); }
.ing-list li:last-child { border-bottom: none; }
.ing-list li::before { content: ''; position: absolute; left: 4px; top: 13px; width: 6px; height: 6px; background: var(--celadon); border-radius: 50%; }
.steps-list { counter-reset: step; }
.steps-list li { padding: 8px 0 8px 32px; position: relative; border-bottom: 1px solid var(--line); }
.steps-list li:last-child { border-bottom: none; }
.steps-list li::before { counter-increment: step; content: counter(step); position: absolute; left: 0; top: 7px; width: 22px; height: 22px; background: var(--celadon-deep); color: #fff; border-radius: 50%; font-size: 12px; font-weight: 600; display: grid; place-items: center; }
.note { margin-top: 22px; background: var(--surface-2); border-left: 3px solid var(--celadon); border-radius: 0 10px 10px 0; padding: 12px 16px; }
.note-label { font-family: var(--font-en); font-size: 13px; color: var(--celadon-deep); font-weight: 500; }
.note p { margin: 4px 0 0; font-size: 14px; line-height: 1.65; color: var(--ink); white-space: pre-wrap; }

.confirm { padding: 24px 24px 20px; }
.confirm h3 { font-family: var(--font-en); font-size: 20px; margin: 0 0 8px; }
.confirm p { font-size: 13.5px; color: var(--ink-soft); line-height: 1.6; margin: 0 0 18px; }
.confirm-btns { display: flex; justify-content: flex-end; gap: 10px; }

.form-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--line); background: var(--surface-2); position: sticky; top: 0; z-index: 2; }
.form-head h3 { font-family: var(--font-en); font-size: 19px; margin: 0; letter-spacing: .5px; }
.form-right { display: flex; align-items: center; gap: 8px; }
.mode-toggle { display: flex; gap: 3px; background: var(--porcelain); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.mode-btn { font-family: var(--font-body); font-size: 12.5px; border: none; background: transparent; color: var(--ink-soft); padding: 5px 11px; border-radius: 999px; cursor: pointer; }
.mode-btn.on { background: var(--celadon-deep); color: #fff; }
.form-body { padding: 20px clamp(16px, 4vw, 26px); display: flex; flex-direction: column; gap: 16px; max-height: 66vh; overflow-y: auto; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field-label { font-family: var(--font-body); font-size: 13.5px; color: var(--ink); font-weight: 500; }
.inp { font-family: var(--font-body); font-size: 16px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); width: 100%; }
.inp:focus { outline: none; border-color: var(--celadon); box-shadow: 0 0 0 3px rgba(110,148,138,.15); }
.ta { resize: vertical; line-height: 1.6; min-height: 60px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: end; }
.row2.tight { gap: 10px; }
.pickrow { display: flex; flex-wrap: wrap; gap: 7px; }
.pick { font-family: var(--font-body); font-size: 13px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 7px 13px; cursor: pointer; color: var(--ink); transition: all .14s; }
.pick:hover { border-color: var(--celadon); }
.pick.on { background: var(--celadon-deep); border-color: var(--celadon-deep); color: #fff; }
.check { display: flex; align-items: center; gap: 9px; font-size: 13.5px; color: var(--ink); cursor: pointer; padding-top: 20px; }
.check input { width: 17px; height: 17px; accent-color: var(--celadon-deep); }
.check span { display: inline-flex; align-items: center; gap: 6px; color: var(--celadon-deep); }
.check em { font-style: normal; color: var(--ink-soft); font-size: 12px; }
.form-err { color: var(--danger); font-size: 13px; margin: 0; }
.form-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--line); background: var(--surface-2); position: sticky; bottom: 0; }

@media (max-width: 620px) {
  .sec-cols { grid-template-columns: 1fr; gap: 12px; }
  .sec-text.en { border-top: 1px dashed var(--line); padding-top: 12px; }
  .row2 { grid-template-columns: 1fr; }
  .row2.tight { grid-template-columns: 1fr 1fr; }
  .check { padding-top: 4px; }
  .rb-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 11px; }
  .card-zh { font-size: 19px; }
}
.header-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.iconbtn.gear { color: var(--ink-soft); }
.btn-capture { background: var(--surface); border-color: var(--line); color: var(--celadon-deep); }
.btn-capture:hover { background: var(--surface-2); border-color: var(--celadon); }
.import-wrap { position: relative; }
.import-menu { display: none; position: absolute; top: calc(100% + 6px); right: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 24px -8px rgba(43,43,39,.25); z-index: 10; min-width: 180px; padding: 5px; }
.import-menu.open { display: block; animation: ovin .12s ease; }
.import-opt { display: flex; align-items: center; gap: 9px; width: 100%; background: none; border: none; font-family: var(--font-body); font-size: 14px; color: var(--ink); padding: 10px 13px; border-radius: 8px; cursor: pointer; text-align: left; }
.import-opt:hover { background: var(--surface-2); }
.import-banner { display: flex; align-items: center; gap: 8px; background: #EEF3E6; border: 1px solid #CFE0BE; color: #46632F; border-radius: 10px; padding: 9px 13px; font-size: 12.5px; line-height: 1.4; margin-bottom: 4px; }
.import-banner svg { flex: none; }
.cap-load { padding: 44px 26px; text-align: center; }
.cap-load .spinner { width: 34px; height: 34px; margin: 0 auto 16px; border: 3px solid var(--line); border-top-color: var(--celadon-deep); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.cap-load h3 { font-family: var(--font-en); font-size: 18px; margin: 0 0 4px; }
.cap-load p { font-size: 13px; color: var(--ink-soft); margin: 0; }
.set-body { padding: 20px clamp(16px,4vw,24px); display: flex; flex-direction: column; gap: 16px; }
.set-hint { font-size: 12.5px; color: var(--ink-soft); line-height: 1.6; margin: 0; }
.set-test { font-size: 13px; margin: 8px 0 0; min-height: 18px; }
.set-test.ok { color: #46632F; }
.set-test.bad { color: var(--danger); }

@media (prefers-reduced-motion: reduce) {
  .btn, .card, .ov, .sheet { animation: none !important; transition: none !important; }
  .cap-load .spinner { animation-duration: 2s; }
}
</style>
</head>
<body>
<div class="rb">
  <header class="rb-head">
    <div class="rb-brand">
      <span class="rb-seal" aria-hidden="true">食</span>
      <div>
        <h1 class="rb-title">My Recipe Book</h1>
        <p class="rb-sub"><span class="rb-count" id="count">0</span> recipes · auto-saves</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="iconbtn gear" id="settingsBtn" aria-label="Settings"></button>
      <div class="import-wrap">
        <button class="btn btn-capture" id="importBtn"></button>
        <div class="import-menu" id="importMenu">
          <button class="import-opt" id="captureBtn"><span id="captureIcon"></span><span>Screenshot</span></button>
          <button class="import-opt" id="linkBtn"><span id="linkIcon"></span><span>From link</span></button>
        </div>
      </div>
      <button class="btn btn-primary" id="addBtn"></button>
    </div>
  </header>

  <div class="rb-bar">
    <div class="rb-searchwrap">
      <span class="rb-searchicon" id="searchIcon"></span>
      <input class="rb-search" id="search" placeholder="Search recipes, ingredients..." autocomplete="off">
      <button class="rb-clear" id="clearBtn" aria-label="Clear" style="display:none"></button>
    </div>
    <div class="rb-chiprow" id="catRow"></div>
    <div class="rb-famrow">
      <span class="rb-famlabel">Who likes it</span>
      <div class="rb-famchips" id="famChips"></div>
    </div>
  </div>

  <div class="rb-error" id="error" style="display:none"></div>
  <div class="rb-grid" id="grid"></div>
</div>

<input type="file" id="capFile" accept="image/*" multiple style="display:none">
<div class="ov" id="overlay" style="display:none"></div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "recipes-v1";

  var CATEGORIES = [
    { id: "breakfast", label: "Breakfast" },
    { id: "lunch", label: "Lunch" },
    { id: "dinner", label: "Dinner" },
    { id: "snack", label: "Snack" },
    { id: "sauce", label: "Sauces" },
    { id: "drinks", label: "Drinks" }
  ];
  var FAMILY = [
    { id: "rachel", label: "Rachel", color: "#5E8C7E" },
    { id: "joey", label: "Joey", color: "#5F7D96" },
    { id: "mia", label: "Mia", color: "#B06F87" },
    { id: "zoey", label: "Zoey", color: "#A07BA8" }
  ];
  function catlabel(id) { for (var i=0;i<CATEGORIES.length;i++) if (CATEGORIES[i].id===id) return CATEGORIES[i].label; return ""; }
  function fam(id) { for (var i=0;i<FAMILY.length;i++) if (FAMILY[i].id===id) return FAMILY[i]; return null; }

  var ICON = {
    search: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.2-3.2" stroke-linecap="round"/></svg>',
    plus: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>',
    close: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg>',
    edit: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 20h4L18.5 9.5a2 2 0 0 0-2.8-2.8L4 18v2z" stroke-linejoin="round" stroke-linecap="round"/></svg>',
    trash: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13" stroke-linejoin="round" stroke-linecap="round"/></svg>',
    leaf: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 4C10 4 4 10 4 20c10 0 16-6 16-16z" stroke-linejoin="round"/><path d="M8 16c3-3 6-5 9-6" stroke-linecap="round"/></svg>',
    back: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 5l-7 7 7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>',

      var nw = cloneRecipe(s); nw.id = id; nw.createdAt = Date.now();
      recipes = [nw].concat(recipes);
    }
    save(); renderGrid(); openDetail(id);
  }
  function parseSimpleText() {
    var text = ($("f_simpleText").value || "").trim();
    if (!text) {
      var e = $("formErr"); e.textContent = "Paste some recipe text first."; e.style.display = "block";
      return;
    }
    formState._simpleText = text;
    var c = getCfg();
    if (!c.url) {
      var e = $("formErr"); e.textContent = "Set up your Worker URL in settings first."; e.style.display = "block";
      return;
    }
    openModal('<div class="cap-load"><div class="spinner"></div><h3>Parsing recipe…</h3><p>Structuring your recipe text…</p></div>', true);
    var headers = { "Content-Type": "application/json" };
    if (c.tok) headers["X-App-Token"] = c.tok;
    fetch(c.url, { method: "POST", headers: headers, body: JSON.stringify({ text: text }) }).then(function (r) {
      return r.json().catch(function () { return { ok: false, error: "bad response" }; }).then(function (j) { return { status: r.status, body: j }; });
    }).then(function (res) {
      if (res.status === 401) { alertModal("Error", "The app token didn't match — check it in settings."); return; }
      if (!res.body || !res.body.ok) {
        var err = (res.body && res.body.error) || "unknown";
        alertModal("Error", "Couldn't parse the recipe: " + esc(err));
        return;
      }
      var parsed = normalizeImported(res.body.recipe);
      formState.nameZh = parsed.nameZh; formState.nameEn = parsed.nameEn;
      formState.category = parsed.category; formState.lowFodmap = parsed.lowFodmap;
      formState.servings = parsed.servings; formState.time = parsed.time;
      formState.ingZh = parsed.ingZh; formState.ingEn = parsed.ingEn;
      formState.stepsZh = parsed.stepsZh; formState.stepsEn = parsed.stepsEn;
      formState.notes = parsed.notes;
      formMode = "detailed";
      formImported = true;
      openModal(formHTML());
      bindForm();
    }).catch(function () {
      alertModal("Error", "Couldn't reach the capture service. Check your connection and the Worker URL in settings.");
    });
  }

  // ---- misc ui ----
  function showError(msg) {
    var el = $("error");
    if (!msg) { el.style.display = "none"; el.textContent = ""; }
    else { el.textContent = msg; el.style.display = "block"; }
  }

  // ---- capture config (stored on this device only) ----
  var CFG = { urlKey: "capture-worker-url", tokKey: "capture-token" };
  function getCfg() {
    var url = "", tok = "";
    try { url = localStorage.getItem(CFG.urlKey) || ""; tok = localStorage.getItem(CFG.tokKey) || ""; } catch (e) {}
    return { url: url, tok: tok };
  }
  function setCfg(url, tok) {
    try {
      if (url) localStorage.setItem(CFG.urlKey, url); else localStorage.removeItem(CFG.urlKey);
      if (tok) localStorage.setItem(CFG.tokKey, tok); else localStorage.removeItem(CFG.tokKey);
    } catch (e) {}
  }

  // ---- settings modal ----
  function openSettings() {
    var c = getCfg();
    var html = '<div class="form">' +
      '<div class="form-head"><h3>Capture settings</h3><button class="iconbtn" id="sClose" aria-label="Close">' + ICON.close + '</button></div>' +
      '<div class="set-body">' +
        '<p class="set-hint">Paste your deployed Worker URL here to enable screenshot and link import. The URL is stored only on this device.</p>' +
        '<label class="field"><span class="field-label">Worker URL</span><input class="inp" id="s_url" value="' + esc(c.url) + '" placeholder="https://recipe-capture.xxx.workers.dev" autocomplete="off"></label>' +
        '<label class="field"><span class="field-label">App token (optional)</span><input class="inp" id="s_tok" value="' + esc(c.tok) + '" placeholder="Leave blank if you didn’t set one" autocomplete="off"></label>' +
        '<div><button class="btn btn-ghost" id="sTest">Test connection</button><p class="set-test" id="sTestMsg"></p></div>' +
      '</div>' +
      '<div class="form-foot"><button class="btn btn-ghost" id="sCancel">Cancel</button><button class="btn btn-primary" id="sSave">Save</button></div>' +
    '</div>';
    openModal(html);
    $("sClose").onclick = closeModal;
    $("sCancel").onclick = closeModal;
    $("sSave").onclick = function () {
      setCfg(($("s_url").value || "").trim().replace(/\/+$/, ""), ($("s_tok").value || "").trim());
      closeModal();
    };
    $("sTest").onclick = function () {
      var url = ($("s_url").value || "").trim().replace(/\/+$/, "");
      var tok = ($("s_tok").value || "").trim();
      var msg = $("sTestMsg");
      msg.className = "set-test"; msg.textContent = "Testing…";
      if (!url) { msg.className = "set-test bad"; msg.textContent = "Enter a URL first"; return; }
      var headers = {}; if (tok) headers["X-App-Token"] = tok;
      fetch(url, { method: "GET", headers: headers }).then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (j) {
          if (r.ok && j && j.ok) { msg.className = "set-test ok"; msg.textContent = "Connected ✓"; }
          else if (r.status === 401) { msg.className = "set-test bad"; msg.textContent = "Token rejected"; }
          else { msg.className = "set-test bad"; msg.textContent = "Not reachable (" + r.status + ")"; }
        });
      }).catch(function () { msg.className = "set-test bad"; msg.textContent = "Can't reach it — check the URL"; });
    };
  }

  // ---- capture flow ----
  function startCapture() {
    if (!getCfg().url) {
      openSettings();
      var m = $("sTestMsg"); if (m) { m.className = "set-test bad"; m.textContent = "Add your Worker URL first"; }
      return;
    }
    $("capFile").click();
  }
  function handleFile(file) {
    showCaptureLoading(1);
    resizeImage(file, 1568, 0.85).then(function (img) {
      var c = getCfg();
      var headers = { "Content-Type": "application/json" };
      if (c.tok) headers["X-App-Token"] = c.tok;
      return fetch(c.url, { method: "POST", headers: headers, body: JSON.stringify({ image: img.data, mediaType: img.mediaType }) });
    }).then(function (r) {
      return r.json().catch(function () { return { ok: false, error: "bad response" }; }).then(function (j) { return { status: r.status, body: j }; });
    }).then(function (res) {
      if (res.status === 401) { alertModal("Error", "The app token didn’t match — check it in settings."); return; }
      if (!res.body || !res.body.ok) {
        alertModal("Error", "Couldn’t read a recipe from that image. Try a clearer screenshot that shows the full ingredients and steps.");
        return;
      }
      openForm(normalizeImported(res.body.recipe), true);
    }).catch(function () {
      alertModal("Error", "Couldn’t reach the capture service. Check your connection and the Worker URL in settings.");
    });
  }
  function handleFiles(files) {
    showCaptureLoading(files.length);
    var promises = [];
    for (var i = 0; i < files.length; i++) promises.push(resizeImage(files[i], 1568, 0.85));
    Promise.all(promises).then(function (images) {
      var c = getCfg();
      var headers = { "Content-Type": "application/json" };
      if (c.tok) headers["X-App-Token"] = c.tok;
      return fetch(c.url, { method: "POST", headers: headers, body: JSON.stringify({ images: images }) });
    }).then(function (r) {
      return r.json().catch(function () { return { ok: false, error: "bad response" }; }).then(function (j) { return { status: r.status, body: j }; });
    }).then(function (res) {
      if (res.status === 401) { alertModal("Error", "The app token didn’t match — check it in settings."); return; }
      if (!res.body || !res.body.ok) {
        alertModal("Error", "Couldn’t read a recipe from those images. Try clearer screenshots that show the full ingredients and steps.");
        return;
      }
      openForm(normalizeImported(res.body.recipe), true);
    }).catch(function () {
      alertModal("Error", "Couldn’t reach the capture service. Check your connection and the Worker URL in settings.");
    });
  }
  function showCaptureLoading(count) {
    var msg = count > 1 ? 'Reading recipe from ' + count + ' images…' : 'Reading recipe from your screenshot…';
    openModal('<div class="cap-load"><div class="spinner"></div><h3>Capturing recipe…</h3><p>' + msg + '</p></div>', true);
  }

  // ---- link import ----
  function startLinkImport() {
    if (!getCfg().url) {
      openSettings();
      var m = $("sTestMsg"); if (m) { m.className = "set-test bad"; m.textContent = "Add your Worker URL first"; }
      return;
    }
    openModal('<div class="form"><div class="form-head"><h3>Import from link</h3><button class="iconbtn" id="liClose" aria-label="Close">' + ICON.close + '</button></div>' +
      '<div class="set-body">' +
        '<label class="field"><span class="field-label">Recipe URL</span><input class="inp" id="li_url" placeholder="Paste recipe URL" autocomplete="off"></label>' +
      '</div>' +
      '<div class="form-foot"><button class="btn btn-ghost" id="liCancel">Cancel</button><button class="btn btn-primary" id="liGo">Import</button></div></div>', true);
    $("liClose").onclick = closeModal;
    $("liCancel").onclick = closeModal;
    $("liGo").onclick = function () {
      var url = ($("li_url").value || "").trim();
      if (!url) return;
      if (!/^https?:\/\//i.test(url)) url = "https://" + url;
      submitLinkImport(url);
    };
    $("li_url").addEventListener("keydown", function (e) { if (e.key === "Enter") $("liGo").click(); });
    setTimeout(function () { $("li_url").focus(); }, 80);
  }
  function submitLinkImport(url) {
    openModal('<div class="cap-load"><div class="spinner"></div><h3>Fetching recipe…</h3><p>Reading the recipe page…</p></div>', true);
    var c = getCfg();
    var headers = { "Content-Type": "application/json" };
    if (c.tok) headers["X-App-Token"] = c.tok;
    fetch(c.url, { method: "POST", headers: headers, body: JSON.stringify({ url: url }) }).then(function (r) {
      return r.json().catch(function () { return { ok: false, error: "bad response" }; }).then(function (j) { return { status: r.status, body: j }; });
    }).then(function (res) {
      if (res.status === 401) { alertModal("Error", "The app token didn’t match — check it in settings."); return; }
      if (!res.body || !res.body.ok) {
        var e = (res.body && res.body.error) || "unknown";
        alertModal("Error", esc(e) + " — try importing a screenshot instead.");
        return;
      }
      openForm(normalizeImported(res.body.recipe), true);
    }).catch(function () {
      alertModal("Error", "Couldn’t reach the capture service. Check your connection and the Worker URL in settings.");
    });
  }
  function alertModal(title, msgHtml) {
    openModal('<div class="confirm"><h3>' + esc(title) + '</h3><p>' + msgHtml + '</p><div class="confirm-btns"><button class="btn btn-primary" id="aOk">OK</button></div></div>', true);
    $("aOk").onclick = closeModal;
  }
  function normalizeImported(r) {
    r = r || {};
    var validCat = false, i;
    for (i = 0; i < CATEGORIES.length; i++) if (CATEGORIES[i].id === r.category) validCat = true;
    function str(v) { if (Array.isArray(v)) return v.join("\n"); return v ? String(v) : ""; }
    return {
      nameZh: str(r.nameZh), nameEn: str(r.nameEn),
      category: validCat ? r.category : "dinner",
      family: [], lowFodmap: !!r.lowFodmap,
      servings: str(r.servings), time: str(r.time),
      ingZh: str(r.ingZh), ingEn: str(r.ingEn),
      stepsZh: str(r.stepsZh), stepsEn: str(r.stepsEn),
      notes: str(r.notes)
    };
  }
  function resizeImage(file, maxEdge, quality) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onerror = function () { reject(new Error("read")); };
      reader.onload = function () {
        var img = new Image();
        img.onerror = function () { reject(new Error("decode")); };
        img.onload = function () {
          var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
          var scale = Math.min(1, maxEdge / Math.max(w, h));
          var cw = Math.max(1, Math.round(w * scale)), ch = Math.max(1, Math.round(h * scale));
          var canvas = document.createElement("canvas");
          canvas.width = cw; canvas.height = ch;
          canvas.getContext("2d").drawImage(img, 0, 0, cw, ch);
          var dataUrl = canvas.toDataURL("image/jpeg", quality);
          resolve({ data: dataUrl.slice(dataUrl.indexOf(",") + 1), mediaType: "image/jpeg" });
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  // ---- init ----
  $("addBtn").innerHTML = ICON.plus + " Add";
  $("importBtn").innerHTML = ICON.image + " Import";
  $("captureIcon").innerHTML = ICON.image;
  $("linkIcon").innerHTML = ICON.link;
  $("settingsBtn").innerHTML = ICON.gear;
  $("searchIcon").innerHTML = ICON.search;
  $("clearBtn").innerHTML = ICON.close;
  $("addBtn").onclick = function () { openForm(null); };
  $("importBtn").onclick = function (e) { e.stopPropagation(); $("importMenu").classList.toggle("open"); };
  $("captureBtn").onclick = function () { $("importMenu").classList.remove("open"); startCapture(); };
  $("linkBtn").onclick = function () { $("importMenu").classList.remove("open"); startLinkImport(); };
  document.addEventListener("click", function () { $("importMenu").classList.remove("open"); });
  $("settingsBtn").onclick = openSettings;
  $("capFile").onchange = function () {
    var fl = this.files;
    if (!fl || !fl.length) return;
    var arr = []; for (var i = 0; i < fl.length; i++) arr.push(fl[i]);
    this.value = "";
    if (arr.length === 1) handleFile(arr[0]);
    else handleFiles(arr);
  };
  var search = $("search"), clearBtn = $("clearBtn");
  search.oninput = function () {
    filters.q = search.value;
    clearBtn.style.display = search.value ? "flex" : "none";
    renderGrid();
  };
  clearBtn.onclick = function () { search.value = ""; filters.q = ""; clearBtn.style.display = "none"; renderGrid(); };

  load();
  buildCatRow();
  buildFamRow();
  renderGrid();
})();
</script>
<script>
if ("serviceWorker" in navigator) {
  var refreshing = false;
  navigator.serviceWorker.addEventListener("controllerchange", function () {
    if (!refreshing) { refreshing = true; window.location.reload(); }
  });
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./service-worker.js").catch(function () {});
  });
}
</script>
</body>
